# Builds on every push and pull request to master.
# Pushing a version tag (e.g. v1.2.0) also publishes KeyboardKeyboard.exe and attaches it to a GitHub release.
name: Build

on:
  push:
    branches: [master]
    tags: ['v*']
  pull_request:
    branches: [master]

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write # needed to create the release

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Build
        run: dotnet build KeyboardKeyboard.sln -c Release

      - name: Publish
        run: |
          $version = if ('${{ github.ref_type }}' -eq 'tag') { '${{ github.ref_name }}'.TrimStart('v') } else { '0.0.0-ci.${{ github.run_number }}' }
          dotnet publish KeyboardKeyboard -p:PublishProfile=SingleFile -p:Version=$version

      - uses: actions/upload-artifact@v4
        with:
          name: KeyboardKeyboard
          path: publish/KeyboardKeyboard.exe

      - name: Create release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create '${{ github.ref_name }}' publish/KeyboardKeyboard.exe --title '${{ github.ref_name }}' --generate-notes
