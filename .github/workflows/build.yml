# Builds Windows, macOS and Linux versions on every push and pull request to master.
# Pushing a version tag (e.g. v1.2.0) also attaches them to a new GitHub release.
name: Build

on:
  push:
    branches: [master]
    tags: ['v*']
  pull_request:
    branches: [master]

jobs:
  build:
    strategy:
      matrix:
        include:
          - { os: windows-latest, rid: win-x64 }
          - { os: macos-latest, rid: osx-arm64 }
          - { os: macos-latest, rid: osx-x64 }
          - { os: ubuntu-latest, rid: linux-x64 }
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Publish
        run: |
          if [ "$GITHUB_REF_TYPE" = tag ]; then version=${GITHUB_REF_NAME#v}; else version=0.0.0-ci.$GITHUB_RUN_NUMBER; fi
          echo "VERSION=$version" >> "$GITHUB_ENV"
          dotnet publish KeyboardKeyboard -p:PublishProfile=SingleFile -r ${{ matrix.rid }} -p:Version=$version

      - name: Package
        run: bash packaging/package.sh ${{ matrix.rid }} "$VERSION"

      - uses: actions/upload-artifact@v4
        with:
          name: KeyboardKeyboard-${{ matrix.rid }}
          path: dist/*

  release:
    if: github.ref_type == 'tag'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write # needed to create the release

    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create '${{ github.ref_name }}' dist/* --repo '${{ github.repository }}' --title '${{ github.ref_name }}' --generate-notes
